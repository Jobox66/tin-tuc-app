name: Tintuc Sync

on:
  # DU PHONG. GitHub hoan cron cua repo public rat nang: do thuc te 17-18/9
  # voi */30 la 141-303 phut/lan. Dat */10 de tang co hoi chay, nhung KHONG
  # trong cho lich nay giu dung nhip.
  schedule:
    - cron: '*/10 * * * *'

  # NGUON KICH HOAT CHINH. Dich vu cron ben ngoai goi API dispatches theo dung
  # nhip mong muon - GitHub khong hoan dispatch thu cong.
  # Xem muc "Kich hoat sync dung nhip" trong README + scripts/trigger-sync.sh
  workflow_dispatch:

# Khong huy run dang chay: mot luot sync chi ~2 phut, con bi huy giua chung
# thi sheet co the dang ghi do. Run moi se xep hang cho luot truoc xong.
concurrency:
  group: news-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Chan run treo lam nghen hang doi
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Node 20 da bi khai tu tren runner cua GitHub
          node-version: '24'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install newspaper3k lxml_html_clean nltk
          python -c "import nltk; nltk.download('punkt'); nltk.download('punkt_tab')"

      - name: Install Node.js dependencies
        run: npm ci

      - name: Verify environment
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
        run: |
          echo "🔍 Checking environment variables..."
          if [ -z "$GOOGLE_SHEET_ID" ]; then echo "❌ GOOGLE_SHEET_ID is EMPTY"; exit 1; fi
          echo "✅ GOOGLE_SHEET_ID is set (length: ${#GOOGLE_SHEET_ID})"
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_EMAIL" ]; then echo "❌ GOOGLE_SERVICE_ACCOUNT_EMAIL is EMPTY"; exit 1; fi
          echo "✅ GOOGLE_SERVICE_ACCOUNT_EMAIL is set (length: ${#GOOGLE_SERVICE_ACCOUNT_EMAIL})"
          if [ -z "$GOOGLE_PRIVATE_KEY" ]; then echo "❌ GOOGLE_PRIVATE_KEY is EMPTY"; exit 1; fi
          echo "✅ GOOGLE_PRIVATE_KEY is set (length: ${#GOOGLE_PRIVATE_KEY})"
          echo "🔍 Python path: $(which python3)"

      - name: Run News Sync
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          PYTHON_PATH: python3
        run: |
          echo "🚀 Starting sync at $(date)"
          npm run sync
          echo "✅ Sync finished at $(date)"
